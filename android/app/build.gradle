apply plugin: 'com.android.application'

// امضای release با keystore محلی — keystore.properties در گیت نمی رود
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.kandoochats.app"
    compileSdk = rootProject.ext.compileSdkVersion

    // سرویس پرداخت درون برنامه ای مارکت ها بدون AIDL و با transact مستقیم پیاده شده است

    // ماتریس خروجی: برند (کندو + برندهای تولیدی) × مارکت (direct/bazaar/myket)
    // ترکیب های مجاز در brands.gradle محدود می شوند: userDirect، adminDirect و <brand><Market>
    flavorDimensions "brand", "market"
    productFlavors {
        user {
            dimension "brand"
            applicationId "com.kandoochats.app"
        }
        admin {
            dimension "brand"
            applicationId "com.kandoo.admin"
        }
        direct { dimension "market" }
        bazaar { dimension "market" }
        myket  { dimension "market" }
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(project.findProperty("kandooVersionCode") ?: "1")
        versionName project.findProperty("kandooVersionName") ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProperties['keyAlias']) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// فلیورهای برندهای تولیدی (نفس/ماه دل/هم مسیر...) + امضای هر برند + محدودسازی ترکیب ها
// این فایل با scripts/brands-generate.mjs تولید می شود
if (file('brands.gradle').exists()) {
    apply from: 'brands.gradle'
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    // google-services.json باید داخل src/user باشد تا فقط برای فلیور کاربر اعمال شود
    def servicesJSON = file('src/user/google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found in src/user, google-services plugin not applied. Push Notifications won't work")
}
